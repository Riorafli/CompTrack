<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTrack — Achievement Reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-wrap"></div>
  <main class="main">
    <div class="topbar"><h1 class="page-title">Achievement Reports</h1></div>
    <div class="content" id="page-content"></div>
  </main>
</div>
<div id="modal-placeholder"></div>
<script src="app.js"></script>
<script>
const user = requireAuth();
if (user) {
  initSidebar('achievement.html', user);
  document.getElementById('modal-placeholder').innerHTML = MODAL_HTML;
  renderPage();
}

// BR-03: days remaining helper
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

// BR-03: inline deadline badge for the pending list
function deadlinePill(comp) {
  if (!comp.achievement_deadline) return '';
  const days  = daysUntil(comp.achievement_deadline);
  const label = comp.achievement_deadline;
  if (days === null) return '';
  if (days < 0)  return `<span style="background:rgba(255,92,106,.15);color:var(--danger);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600">⛔ Overdue · ${label}</span>`;
  if (days <= 3) return `<span style="background:rgba(255,181,71,.15);color:var(--warn);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600">⚠️ ${days}d left · ${label}</span>`;
  return `<span style="background:rgba(79,138,255,.1);color:var(--accent);border-radius:4px;padding:2px 7px;font-size:11px">📅 ${days}d left · ${label}</span>`;
}

async function renderPage() {
  const competitions = await getCompetitions();
  const mine = competitions;
  const withAch = mine.filter(c => c.achievement);
  // BR-03: include letter_generated status as also pending
  const pending = mine.filter(c => (c.status === 'faculty_approved' || c.status === 'letter_generated') && !c.achievement);

  document.getElementById('page-content').innerHTML = `
  ${pending.length ? `
  <div class="card" style="border-color:rgba(255,181,71,.4)">
    <div class="card-title" style="color:var(--warn)">⚠️ Pending Achievement Reports (${pending.length})</div>
    ${pending.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:500">${c.name}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">${formatDate(c.date_end || c.dateEnd)} · ${c.id}</div>
        <div style="margin-top:6px">${deadlinePill(c)}</div>
      </div>
      <button class="btn btn-warn btn-sm" onclick="openAchievementForm('${c.id}',${JSON.stringify(c).replace(/"/g,'&quot;')})">Report Now</button>
    </div>`).join('')}
  </div>` : ''}

  <div class="card">
    <div class="card-title">Achievement Records</div>
    ${withAch.length ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
      ${withAch.map(c => `
      <div class="achievement-card" onclick="viewDetail('${c.id}',${JSON.stringify(user).replace(/"/g,'&quot;')})">
        <div style="font-size:36px;margin-bottom:12px">${c.achievement.result==='Winner'?'🥇':c.achievement.result==='Finalist'?'🎖️':'🏅'}</div>
        <div style="font-weight:600;margin-bottom:4px">${c.name}</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px">${c.id} · ${c.level}</div>
        <span class="status status-completed">${c.achievement.result}</span>
        <div style="margin-top:10px;font-size:12px;color:var(--text3)">
          ${c.achievement.certificate?'✅ Certificate':'❌ Certificate'} &nbsp;
          ${c.achievement.documentation?'✅ Docs':'❌ Docs'}
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:6px">Reported: ${formatDate(c.achievement.reported_at || c.achievement.reportedAt)}</div>
      </div>`).join('')}
    </div>` : `
    <div class="empty-state">
      <div class="empty-icon">🏅</div>
      <div class="empty-title">No achievements recorded yet</div>
      <div class="empty-sub">Submit your post-competition reports here</div>
    </div>`}
  </div>`;
}

// BR-03: accept full comp object to show deadline notice inside the modal
function openAchievementForm(id, comp) {
  let deadlineNotice = '';
  if (comp && comp.achievement_deadline) {
    const days = daysUntil(comp.achievement_deadline);
    if (days !== null && days < 0) {
      deadlineNotice = `<div style="background:rgba(255,92,106,.12);border:1px solid var(--danger);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--danger);font-size:13px">
        ⛔ <strong>Deadline passed</strong> — was ${comp.achievement_deadline}. Submission may be rejected by the server.
      </div>`;
    } else if (days !== null && days <= 3) {
      deadlineNotice = `<div style="background:rgba(255,181,71,.12);border:1px solid var(--warn);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--warn);font-size:13px">
        ⚠️ <strong>Deadline in ${days} day${days===1?'':'s'}</strong> — report by ${comp.achievement_deadline}
      </div>`;
    } else if (days !== null) {
      deadlineNotice = `<div style="background:rgba(79,138,255,.08);border:1px solid rgba(79,138,255,.3);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--text2);font-size:13px">
        📅 Report deadline: <strong>${comp.achievement_deadline}</strong> (${days} days remaining)
      </div>`;
    }
  }

  openModal('Report Achievement', `
  ${deadlineNotice}
  <div class="form-grid">
    <div class="form-group full"><label>Final Result *</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${['Winner','Runner-up','Finalist','Participant'].map(r => `
        <button type="button" onclick="
          document.querySelectorAll('.result-btn').forEach(b=>b.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('ach-result').value=this.dataset.value;
        " data-value="${r}" class="result-btn btn btn-ghost btn-sm" style="flex:1;min-width:100px">${r === 'Winner' ? '🥇' : r === 'Runner-up' ? '🥈' : r === 'Finalist' ? '🎖️' : '🏅'} ${r}</button>`).join('')}
      </div>
      <input type="hidden" id="ach-result" value="Winner">
    </div>
    ${buildFileUploadField('ach-cert', 'Certificate Upload')}
    ${buildFileUploadField('ach-docs', 'Documentation Upload')}
    <div class="form-group full"><label>Notes</label><textarea id="ach-notes" placeholder="Additional information..."></textarea></div>
  </div>`,
  `<button class="btn btn-ghost" onclick="closeModalDirect()">Cancel</button>
   <button class="btn btn-success" onclick="submitAchievement('${id}')">Submit Report</button>`);
}

async function submitAchievement(id) {
  const btn = document.querySelector('.btn-success');
  if (btn) { btn.textContent = 'Submitting...'; btn.disabled = true; }

  try {
    const result = document.getElementById('ach-result')?.value || 'Participant';
    const certInput = document.getElementById('ach-cert');
    const docsInput = document.getElementById('ach-docs');
    const notes = document.getElementById('ach-notes')?.value?.trim() || '';

    const formData = new FormData();
    formData.append('result', result);
    if (notes) formData.append('notes', notes);
    if (certInput?.files?.length) formData.append('certificate', certInput.files[0]);
    if (docsInput?.files?.length) formData.append('documentation', docsInput.files[0]);

    const res = await apiFetch(`/competitions/${id}/achievement`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    closeModalDirect();
    toast('Achievement reported! 🎉', 'success');
    renderPage();
  } catch (err) {
    toast(err.message || 'Failed to submit', 'error');
    if (btn) { btn.textContent = 'Submit Report'; btn.disabled = false; }
  }
}
</script>
</body>
</html>
