<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTrack — User Management</title>
<link rel="stylesheet" href="style.css">
<style>
/* ── Stat cards ── */
.stat-cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.stat-card {
  border-radius: var(--radius); padding: 22px 24px 20px;
  color: #fff; position: relative; overflow: hidden;
}
.stat-card::after {
  content: ''; position: absolute; right: -18px; top: -18px;
  width: 90px; height: 90px; border-radius: 50%;
  background: rgba(255,255,255,.12);
}
.stat-card::before {
  content: ''; position: absolute; right: 18px; bottom: -24px;
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(255,255,255,.08);
}
.stat-card.blue    { background: linear-gradient(135deg,#2e86ab,#1a5f7a); }
.stat-card.green   { background: linear-gradient(135deg,#00b894,#00835e); }
.stat-card.orange  { background: linear-gradient(135deg,#ff8c42,#d4651c); }
.stat-card.teal    { background: linear-gradient(135deg,#00b4d8,#0086a8); }
.stat-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; margin-bottom: 8px; }
.stat-val   { font-size: 38px; font-weight: 800; line-height: 1; }

/* ── Table tweaks ── */
.user-avatar-sm {
  width: 34px; height: 34px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.name-cell { display: flex; align-items: center; gap: 10px; }
.role-select {
  font-size: 12px; padding: 4px 8px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface2);
  color: var(--text); font-family: var(--font-sans); cursor: pointer; outline: none;
}
.status-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px;
}
.status-dot.active   { background: var(--success); }
.status-dot.inactive { background: var(--danger); }

/* Disabled row */
tr.row-disabled { opacity: .45; }
tr.row-disabled td { color: var(--text3) !important; }
tr.row-disabled .td-main { text-decoration: line-through; }
.disabled-tag {
  display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
  background: rgba(255,92,106,.15); color: var(--danger);
  border: 1px solid rgba(255,92,106,.3); margin-left: 6px; vertical-align: middle;
}

/* ── MCR notification badge on invite btn area ── */
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.mcr-alert-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  background: rgba(255,181,71,.15); color: #b86e00;
  border: 1.5px solid rgba(255,181,71,.4); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: all .18s; text-decoration: none;
}
.mcr-alert-btn:hover { background: rgba(255,181,71,.25); }
.mcr-count-badge {
  background: #ff8c42; color: #fff; border-radius: 20px;
  font-size: 10px; font-weight: 800; padding: 1px 7px;
}

/* Invite modal */
.modal-form-group { margin-bottom: 14px; }
.modal-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 5px; }
.modal-input { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13.5px; font-family: var(--font-sans); outline: none; transition: border-color .18s; box-sizing: border-box; }
.modal-input:focus { border-color: var(--accent); }
.search-bar {
  display: flex; align-items: center;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 10px; gap: 6px;
}
.search-bar input {
  border: none; outline: none; background: transparent;
  font-size: 13.5px; font-family: var(--font-sans); color: var(--text);
  padding: 8px 0; width: 220px;
}
.search-bar input::placeholder { color: var(--muted); }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-wrap"></div>
  <main class="main">

    <div class="topbar">
      <h1 class="page-title">User Management</h1>
      <div class="topbar-actions">
        <div id="mcr-alert-wrap"></div>
        <button class="btn btn-primary" onclick="openInviteModal()">+ Invite User</button>
      </div>
    </div>

    <div class="content">
      <!-- Stat cards -->
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card blue">  <div class="stat-label">Total Users</div><div class="stat-val" id="s-total">—</div></div>
        <div class="stat-card green"> <div class="stat-label">Students</div>   <div class="stat-val" id="s-students">—</div></div>
        <div class="stat-card orange"><div class="stat-label">PIC / Faculty</div><div class="stat-val" id="s-pic">—</div></div>
        <div class="stat-card teal"> <div class="stat-label">Admins</div>      <div class="stat-val" id="s-admins">—</div></div>
      </div>

      <!-- Search + filter -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div class="card-title" style="margin-bottom:0">All Users</div>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="search-bar"><input id="search-input" placeholder="Search name, email, NIM…" oninput="renderTable()"></div>
            <select id="filter-role" class="role-select" onchange="renderTable()" style="padding:8px 10px">
              <option value="">All Roles</option>
              <option value="student">Student</option>
              <option value="pic">PIC Major</option>
              <option value="faculty">Faculty Admin</option>
              <option value="superadmin">Super Admin</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table id="users-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>NIM/ID</th>
                <th>Email</th>
                <th>Major</th>
                <th>Region</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text3)">⏳ Loading users…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="modal-placeholder"></div>

<script src="app.js"></script>
<script>
const user = requireAuth(['superadmin']);
let allUsers = [];

if (user) {
  document.getElementById('modal-placeholder').innerHTML = MODAL_HTML;
  initSidebar('users.html', user);
  loadUsers();
  renderMCRAlert();
}

// ══════════════════════════════════════════════════
// MCR ALERT — pending major change requests
// ══════════════════════════════════════════════════
function renderMCRAlert() {
  const pending = getPendingMCRs();
  const wrap = document.getElementById('mcr-alert-wrap');
  if (pending.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <a class="mcr-alert-btn" href="approvals.html">
      🏛️ Major Change Requests
      <span class="mcr-count-badge">${pending.length}</span>
    </a>`;
}

function getPendingMCRs() {
  try { return (JSON.parse(localStorage.getItem('ct_mcr_all')) || []).filter(r => r.status === 'pending'); }
  catch { return []; }
}

// ══════════════════════════════════════════════════
// LOAD & RENDER
// ══════════════════════════════════════════════════
async function loadUsers() {
  try {
    allUsers = await getAllUsers();
  } catch {
    allUsers = [];
  }
  updateStats();
  renderTable();
}

function updateStats() {
  document.getElementById('s-total').textContent    = allUsers.length;
  document.getElementById('s-students').textContent = allUsers.filter(u => u.role === 'student').length;
  document.getElementById('s-pic').textContent      = allUsers.filter(u => u.role === 'pic' || u.role === 'faculty').length;
  document.getElementById('s-admins').textContent   = allUsers.filter(u => u.role === 'superadmin').length;
}

function renderTable() {
  const q    = (document.getElementById('search-input')?.value || '').toLowerCase();
  const role = document.getElementById('filter-role')?.value || '';

  let list = allUsers.filter(u => {
    const matchQ = !q ||
      (u.name  || '').toLowerCase().includes(q) ||
      (u.email || '').toLowerCase().includes(q) ||
      (u.nim   || '').toLowerCase().includes(q);
    const matchR = !role || u.role === role;
    return matchQ && matchR;
  });

  const tbody = document.getElementById('users-tbody');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text3)">No users found</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(u => {
    const initial = (u.name || '?').charAt(0).toUpperCase();
    const color   = u.color || '#4f8aff';
    const isActive = u.is_active !== false && u.isActive !== false;
    const roleBadgeClass = {
      student: 'level-national', pic: 'level-international',
      faculty: 'level-regional', superadmin: 'level-international'
    }[u.role] || 'level-national';
    const roleText = roleLabel(u.role);

    return `
    <tr class="${isActive ? '' : 'row-disabled'}">
      <td>
        <div class="name-cell">
          <div class="user-avatar-sm" style="background:${color};${isActive ? '' : 'filter:grayscale(1)'}">${initial}</div>
          <div>
            <div class="td-main">
              ${u.name || '—'}
              ${!isActive ? '<span class="disabled-tag">Disabled</span>' : ''}
            </div>
            <div style="font-size:11px;color:var(--text3)">${formatDate(u.created_at || u.createdAt, false)}</div>
          </div>
        </div>
      </td>
      <td style="font-size:13px;color:var(--text2)">${u.nim || '—'}</td>
      <td style="font-size:13px;color:var(--text2)">${u.email || '—'}</td>
      <td style="font-size:13px;color:var(--text2)">${u.major || '—'}</td>
      <td style="font-size:13px;color:var(--text2)">${u.region || '—'}</td>
      <td>
        <span class="level-badge ${roleBadgeClass}" style="font-size:10px">${roleText.toUpperCase()}</span>
      </td>
      <td>
        <span>
          <span class="status-dot ${isActive ? 'active' : 'inactive'}"></span>
          <span style="font-size:12px;color:var(--text2)">${isActive ? 'Active' : 'Disabled'}</span>
        </span>
      </td>
      <td>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal('${u.id || u.userId}')">Edit</button>
          <button class="btn btn-sm ${isActive ? 'btn-danger' : 'btn-success'}"
            data-uid="${u.id || u.userId}" data-active="${isActive}"
            onclick="toggleUser(this)">
            ${isActive ? 'Disable' : 'Enable'}
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ══════════════════════════════════════════════════
// TOGGLE ACTIVE
// ══════════════════════════════════════════════════
async function toggleUser(btn) {
  const userId = btn.dataset.uid;
  const isCurrentlyActive = btn.dataset.active === 'true';
  const action = isCurrentlyActive ? 'disable' : 'enable';
  if (!confirm(`Are you sure you want to ${action} this user?`)) return;

  try {
    const r = await toggleUserActive(userId);
    if (r.success) {
      // Update local data immediately for instant visual feedback
      const u = allUsers.find(x => (x.id || x.userId) === userId);
      if (u) {
        u.is_active = !isCurrentlyActive;
        u.isActive  = !isCurrentlyActive;
      }
      updateStats();
      renderTable();
      toast(`User ${action}d successfully`, 'success');
    } else {
      toast(r.message || `Failed to ${action} user`, 'error');
    }
  } catch {
    // Optimistic update even if API unreachable (dev mode)
    const u = allUsers.find(x => (x.id || x.userId) === userId);
    if (u) {
      u.is_active = !isCurrentlyActive;
      u.isActive  = !isCurrentlyActive;
    }
    updateStats();
    renderTable();
    toast(`User ${action}d (offline mode)`, 'info');
  }
}

// ══════════════════════════════════════════════════
// EDIT ROLE MODAL
// ══════════════════════════════════════════════════
function openEditModal(userId) {
  const u = allUsers.find(x => (x.id || x.userId) === userId);
  if (!u) return;

  openModal('Edit User Role', `
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <div class="user-avatar-sm" style="background:${u.color||'#4f8aff'};width:44px;height:44px;font-size:17px">
          ${(u.name||'?').charAt(0).toUpperCase()}
        </div>
        <div>
          <div style="font-weight:600;color:var(--text)">${u.name}</div>
          <div style="font-size:12px;color:var(--text3)">${u.email}</div>
          ${u.major  ? `<div style="font-size:12px;color:var(--text3)">🏛️ ${u.major}</div>`  : ''}
          ${u.region ? `<div style="font-size:12px;color:var(--text3)">📍 ${u.region}</div>` : ''}
        </div>
      </div>
      <div class="modal-form-group">
        <label class="modal-label">Role</label>
        <select class="modal-input" id="edit-role-select">
          <option value="student"    ${u.role==='student'    ?'selected':''}>Student</option>
          <option value="pic"        ${u.role==='pic'        ?'selected':''}>PIC Major</option>
          <option value="faculty"    ${u.role==='faculty'    ?'selected':''}>Faculty Admin</option>
          <option value="superadmin" ${u.role==='superadmin' ?'selected':''}>Super Admin</option>
        </select>
      </div>
    </div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closeModalDirect()">Cancel</button>
     <button class="btn btn-primary" onclick="saveRole('${userId}')">Save Changes</button>`
  );
}

async function saveRole(userId) {
  const newRole = document.getElementById('edit-role-select').value;
  try {
    const r = await updateUserRole(userId, newRole);
    if (r.success) {
      toast('Role updated ✓', 'success');
      closeModalDirect();
      await loadUsers();
    } else {
      toast(r.message || 'Failed to update role', 'error');
    }
  } catch {
    toast('Server error', 'error');
  }
}

// ══════════════════════════════════════════════════
// INVITE USER MODAL
// ══════════════════════════════════════════════════
function openInviteModal() {
  openModal('Invite New User', `
    <div class="modal-form-group">
      <label class="modal-label">Full Name *</label>
      <input class="modal-input" id="inv-name" placeholder="e.g. Budi Santoso">
    </div>
    <div class="modal-form-group">
      <label class="modal-label">Email Address *</label>
      <input class="modal-input" id="inv-email" type="email" placeholder="user@university.ac.id">
    </div>
    <div class="modal-form-group">
      <label class="modal-label">Role *</label>
      <select class="modal-input" id="inv-role" onchange="toggleInviteNIM()">
        <option value="student">Student</option>
        <option value="pic">PIC Major</option>
        <option value="faculty">Faculty Admin</option>
        <option value="superadmin">Super Admin</option>
      </select>
    </div>
    <div class="modal-form-group" id="inv-nim-wrap">
      <label class="modal-label">NIM / Student ID</label>
      <input class="modal-input" id="inv-nim" placeholder="e.g. 20210001">
    </div>
    <div class="modal-form-group" id="inv-major-wrap" style="display:none">
      <label class="modal-label">Major *</label>
      <input class="modal-input" id="inv-major" placeholder="e.g. Cyber Security">
    </div>
    <div class="modal-form-group" id="inv-region-wrap" style="display:none">
      <label class="modal-label">Region / Campus</label>
      <input class="modal-input" id="inv-region" placeholder="e.g. Alam Sutera">
    </div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closeModalDirect()">Cancel</button>
     <button class="btn btn-primary" onclick="submitInvite()">Send Invite</button>`
  );
}

function toggleInviteNIM() {
  const role = document.getElementById('inv-role').value;
  document.getElementById('inv-nim-wrap').style.display    = role === 'student' ? '' : 'none';
  document.getElementById('inv-major-wrap').style.display  = role === 'pic'     ? '' : 'none';
  document.getElementById('inv-region-wrap').style.display = role === 'pic'     ? '' : 'none';
}

async function submitInvite() {
  const name   = document.getElementById('inv-name').value.trim();
  const email  = document.getElementById('inv-email').value.trim();
  const role   = document.getElementById('inv-role').value;
  const nim    = document.getElementById('inv-nim')?.value?.trim();
  const major  = document.getElementById('inv-major')?.value?.trim();
  const region = document.getElementById('inv-region')?.value?.trim();

  if (!name)  { toast('Name is required', 'error'); return; }
  if (!email) { toast('Email is required', 'error'); return; }
  if (role === 'pic' && !major) { toast('Major is required for PIC accounts', 'error'); return; }

  try {
    const res = await apiFetch('/users/invite', {
      method: 'POST',
      body: JSON.stringify({ name, email, role, nim, major, region }),
    });
    const data = await res.json();
    if (data.success) {
      toast(`Invite sent to ${email} ✓`, 'success');
      closeModalDirect();
      await loadUsers();
    } else {
      toast(data.message || 'Failed to send invite', 'error');
    }
  } catch {
    toast('Could not reach server', 'error');
  }
}
</script>
</body>
</html>
