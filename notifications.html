<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTrack — Notifications</title>
<link rel="stylesheet" href="style.css">
<style>
.notif-list { display: flex; flex-direction: column; gap: 0; }
.notif-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  transition: background .15s; cursor: default; position: relative;
}
.notif-item:last-child { border-bottom: none; }
.notif-item.unread { background: rgba(46,134,171,.04); }
.notif-item.unread::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
}
.notif-icon {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; background: var(--surface2);
}
.notif-icon.mcr  { background: rgba(255,181,71,.15); }
.notif-icon.comp { background: rgba(46,134,171,.12); }
.notif-icon.sys  { background: rgba(0,200,150,.12); }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.notif-msg   { font-size: 12.5px; color: var(--text2); line-height: 1.5; }
.notif-time  { font-size: 11px; color: var(--text3); margin-top: 5px; }
.notif-actions { display: flex; gap: 6px; margin-top: 8px; }
.notif-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 4px; }

.filter-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.filter-tab {
  padding: 6px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 500;
  border: 1.5px solid var(--border); background: transparent; color: var(--text2);
  cursor: pointer; transition: all .15s;
}
.filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.notif-header-bar {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-wrap"></div>
  <main class="main">
    <div class="topbar">
      <h1 class="page-title">Notifications</h1>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all as read</button>
      </div>
    </div>
    <div class="content">
      <div class="card">
        <div class="notif-header-bar">
          <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
            <button class="filter-tab" onclick="setFilter('unread', this)">Unread</button>
            <button class="filter-tab" onclick="setFilter('mcr', this)">Major Requests</button>
          </div>
          <div style="font-size:12px;color:var(--text3)" id="notif-count-label"></div>
        </div>
        <div class="notif-list" id="notif-list">
          <div style="text-align:center;padding:40px;color:var(--text3)">⏳ Loading…</div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="modal-placeholder"></div>
<script src="app.js"></script>
<script>
const user = requireAuth();
let allNotifs = [];
let currentFilter = 'all';

if (user) {
  document.getElementById('modal-placeholder').innerHTML = MODAL_HTML;
  initSidebar('notifications.html', user);
  loadNotifications();
}

// ══════════════════════════════════════════════════
// LOAD
// ══════════════════════════════════════════════════
async function loadNotifications() {
  // 1. API notifications
  let apiNotifs = [];
  try {
    const res = await apiFetch('/notifications');
    const data = await res.json();
    if (data.success) apiNotifs = (data.data || []).map(n => ({
      id: n.id,
      type: n.type || 'comp',
      icon: n.icon || '🔔',
      title: n.title || 'Notification',
      message: n.message || n.body || '',
      href: n.href || null,
      createdAt: n.created_at || n.createdAt,
      read: !!n.is_read || !!n.read,
      source: 'api',
    }));
  } catch {}

  // 2. Local superadmin notifications (MCR etc.)
  let localNotifs = [];
  if (user.role === 'superadmin') {
    try {
      localNotifs = (JSON.parse(localStorage.getItem('ct_sa_notifs')) || []).map(n => ({
        ...n, source: 'local',
        icon: n.icon || '🏛️',
        type: n.type || 'mcr',
      }));
    } catch {}
  }

  // Merge, deduplicate by id, sort newest first
  const seen = new Set();
  allNotifs = [...localNotifs, ...apiNotifs].filter(n => {
    if (seen.has(n.id)) return false;
    seen.add(n.id);
    return true;
  }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  renderNotifications();
}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNotifications();
}

function renderNotifications() {
  let list = allNotifs;
  if (currentFilter === 'unread') list = list.filter(n => !n.read);
  if (currentFilter === 'mcr')    list = list.filter(n => n.type === 'major_change_request' || n.type === 'mcr');

  const unreadCount = allNotifs.filter(n => !n.read).length;
  document.getElementById('notif-count-label').textContent =
    `${unreadCount} unread · ${allNotifs.length} total`;

  if (!list.length) {
    document.getElementById('notif-list').innerHTML = `
      <div style="text-align:center;padding:48px 20px">
        <div style="font-size:32px;margin-bottom:10px">🔔</div>
        <div style="font-weight:600;color:var(--text);margin-bottom:4px">All caught up!</div>
        <div style="font-size:13px;color:var(--text3)">No notifications to show</div>
      </div>`;
    return;
  }

  document.getElementById('notif-list').innerHTML = list.map(n => {
    const iconClass = n.type === 'major_change_request' || n.type === 'mcr' ? 'mcr'
                    : n.type === 'system' ? 'sys' : 'comp';
    const timeStr = n.createdAt ? formatDate(n.createdAt, true) : '—';

    return `
    <div class="notif-item ${n.read ? '' : 'unread'}" id="notif-${n.id}">
      <div class="notif-icon ${iconClass}">${n.icon || '🔔'}</div>
      <div class="notif-body">
        <div class="notif-title">${n.title}</div>
        <div class="notif-msg">${n.message}</div>
        <div class="notif-time">${timeStr}</div>
        ${(n.type === 'major_change_request' || n.type === 'mcr') ? `
        <div class="notif-actions">
          <a href="approvals.html" class="btn btn-primary btn-sm">Review Request →</a>
          ${!n.read ? `<button class="btn btn-ghost btn-sm" onclick="markOneRead('${n.id}','${n.source}')">Mark read</button>` : ''}
        </div>` : (!n.read ? `
        <div class="notif-actions">
          <button class="btn btn-ghost btn-sm" onclick="markOneRead('${n.id}','${n.source}')">Mark read</button>
        </div>` : '')}
      </div>
      <div class="notif-right">
        ${!n.read ? '<div class="unread-dot"></div>' : ''}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════
// MARK READ
// ══════════════════════════════════════════════════
async function markOneRead(id, source) {
  // Update in memory
  const n = allNotifs.find(x => x.id == id);
  if (n) n.read = true;

  if (source === 'local') {
    // Update local store
    try {
      const local = JSON.parse(localStorage.getItem('ct_sa_notifs')) || [];
      const item = local.find(x => x.id == id);
      if (item) item.read = true;
      localStorage.setItem('ct_sa_notifs', JSON.stringify(local));
    } catch {}
  } else {
    await markNotificationRead(id);
  }
  renderNotifications();
  // Refresh sidebar badge
  initSidebar('notifications.html', user);
}

async function markAllRead() {
  allNotifs.forEach(n => n.read = true);

  // Update local store
  try {
    const local = JSON.parse(localStorage.getItem('ct_sa_notifs')) || [];
    local.forEach(n => n.read = true);
    localStorage.setItem('ct_sa_notifs', JSON.stringify(local));
  } catch {}

  // Update API
  await markAllNotificationsRead();

  renderNotifications();
  initSidebar('notifications.html', user);
  toast('All notifications marked as read', 'success');
}
</script>
</body>
</html>
