<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTrack — My Submissions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-wrap"></div>
  <main class="main">
    <div class="topbar">
      <h1 class="page-title">My Submissions</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openSubmissionForm()">+ New Submission</button>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </main>
</div>
<div id="modal-placeholder"></div>
<script src="app.js"></script>
<script>
const user = requireAuth(['student']);
if (user) {
  initSidebar('submissions.html', user);
  document.getElementById('modal-placeholder').innerHTML = MODAL_HTML;
  renderPage();
}

let membersList = [];

const MAJORS_LIST = {
  'Kemanggisan': ['Computer Science','Computer Science - Statistics','Computer Science - Mathematics','Game Application & Technology','Cyber Security','Artificial Intelligence','Data Science'],
  'Alam Sutera': ['Computer Science','Computer Science - Global Class','Cyber Security','Artificial Intelligence'],
  'Bekasi':      ['Computer Science - Software Engineering'],
  'Bandung':     ['Computer Science'],
  'Malang':      ['Computer Science'],
  'Semarang':    ['Computer Science'],
  'Medan':       ['Computer Science'],
};

// ── FR-04: Polling — auto-refresh every 30 s ─────────────
const POLL_INTERVAL = 30_000; // ms
let   _pollTimer    = null;
let   _lastData     = null;   // serialised snapshot for change detection
let   _activeFilter = 'all';  // track current filter so poll respects it

function _isModalOpen() {
  const overlay = document.getElementById('modal-overlay') || document.querySelector('.modal-overlay');
  return overlay && overlay.style.display !== 'none' && overlay.style.display !== '';
}

function _timestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function _updateLastSeen() {
  const el = document.getElementById('poll-last-updated');
  if (el) el.textContent = `Updated ${_timestamp()}`;
}

async function _pollRefresh() {
  if (_isModalOpen()) return; // user is interacting — skip this tick

  try {
    const params = _activeFilter !== 'all' ? { status: _activeFilter } : {};
    const fresh = await getCompetitions(params);
    const serialised = JSON.stringify(fresh.map(c => ({ id: c.id, status: c.status, deadline: c.achievement_deadline })));

    if (serialised !== _lastData) {
      _lastData = serialised;
      const tbody = document.getElementById('sub-table');
      if (tbody) {
        tbody.innerHTML = renderRows(fresh);
        tbody.style.transition = 'opacity 0.3s';
        tbody.style.opacity = '0.4';
        requestAnimationFrame(() => { tbody.style.opacity = '1'; });
      }
    }
    _updateLastSeen();
  } catch (_) {
    // Silent fail — don't bother the user with polling errors
  }
}

function startPolling() {
  stopPolling();
  _pollTimer = setInterval(_pollRefresh, POLL_INTERVAL);
}

function stopPolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

// Stop polling when tab is hidden, resume when visible — saves server load
document.addEventListener('visibilitychange', () => {
  document.hidden ? stopPolling() : startPolling();
});

async function renderPage() {
  const competitions = await getCompetitions();
  const myComps = competitions;
  _lastData = JSON.stringify(myComps.map(c => ({ id: c.id, status: c.status, deadline: c.achievement_deadline })));

  document.getElementById('page-content').innerHTML = myComps.length ? `
  <div class="filters" id="filter-row">
    ${['all','draft','submitted','pic_approved','faculty_approved','completed'].map((s,i) =>
      `<button class="filter-chip${i===0?' active':''}" onclick="applyFilter(this,'${s}')">${s==='all'?'All':statusLabel(s)}</button>`
    ).join('')}
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div></div>
      <div id="poll-last-updated" style="font-size:11px;color:var(--text3)">Updated ${_timestamp()}</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Competition</th><th>Level</th><th>Funding</th><th>Status</th><th>Report Deadline</th><th>Actions</th></tr></thead>
        <tbody id="sub-table">${renderRows(myComps)}</tbody>
      </table>
    </div>
  </div>` : `
  <div class="empty-state">
    <div class="empty-icon">📋</div>
    <div class="empty-title">No Submissions Yet</div>
    <div class="empty-sub">Click "+ New Submission" to get started</div>
  </div>`;

  startPolling(); // FR-04: begin 30 s auto-refresh after first render
}

// BR-03: compute days remaining from today to a YYYY-MM-DD deadline string
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

// BR-03: render a coloured deadline badge for the "Report Deadline" column
function deadlineBadge(comp) {
  if (!comp.achievement_deadline) return '<span style="color:var(--text3)">—</span>';
  if (comp.achievement) return '<span style="color:var(--text3)">—</span>'; // already reported

  const days = daysUntil(comp.achievement_deadline);
  const label = comp.achievement_deadline; // YYYY-MM-DD

  if (days === null) return '<span style="color:var(--text3)">—</span>';

  if (days < 0) {
    return `<span style="color:var(--danger);font-weight:600;font-size:12px">⛔ Overdue<br><span style="font-weight:400">${label}</span></span>`;
  }
  if (days <= 3) {
    return `<span style="color:var(--warn);font-weight:600;font-size:12px">⚠️ ${days}d left<br><span style="font-weight:400">${label}</span></span>`;
  }
  return `<span style="color:var(--text2);font-size:12px">📅 ${days}d left<br><span style="color:var(--text3)">${label}</span></span>`;
}

function renderRows(list) {
  return list.map(c => `
  <tr>
    <td style="font-size:11px;color:var(--text3)">${c.id}</td>
    <td><div class="td-main">${c.name}</div><div style="font-size:11px;color:var(--text3)">${c.organizer}</div></td>
    <td><span class="level-badge level-${c.level}">${c.level}</span></td>
    <td>IDR ${formatFunding(c.funding)}</td>
    <td><span class="status status-${c.status}">${statusLabel(c.status)}</span></td>
    <td>${deadlineBadge(c)}</td>
    <td style="white-space:nowrap">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="viewDetail('${c.id}',${JSON.stringify(user).replace(/"/g,'&quot;')})">Detail</button>
      ${c.status==='draft'?`<button class="btn btn-primary btn-sm" onclick="submitComp('${c.id}')">Submit</button>`:''}
      ${c.status==='draft'||c.status==='pic_rejected'?`<button class="btn btn-ghost btn-sm" onclick="openSubmissionForm('${c.id}')">Edit</button>`:''}
      ${c.letterGenerated?`<button class="btn btn-accent btn-sm" onclick="downloadLetter('${c.id}')">📄 Letter</button>`:''}
      ${(c.status==='faculty_approved'||c.status==='letter_generated')&&!c.achievement?`<button class="btn btn-success btn-sm" onclick="openAchievementForm('${c.id}',${JSON.stringify(c).replace(/"/g,'&quot;')})">Report</button>`:''}
      </div>
    </td>
  </tr>`).join('');
}

async function applyFilter(el, status) {
  document.querySelectorAll('.filter-chip').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  _activeFilter = status; // FR-04: keep polling in sync with current filter
  const filtered = await getCompetitions(status !== 'all' ? { status } : {});
  _lastData = JSON.stringify(filtered.map(c => ({ id: c.id, status: c.status, deadline: c.achievement_deadline })));
  document.getElementById('sub-table').innerHTML = renderRows(filtered);
  _updateLastSeen();
}

// Normalise any date value (ISO string, Date object, or YYYY-MM-DD) to the
// "yyyy-MM-dd" string that <input type="date"> and the API both require.
function toDateInput(val) {
  if (!val) return '';
  if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  const d = val instanceof Date ? val : new Date(val);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

async function submitComp(id) {
  try {
    const existing = await getCompetition(id);
    if (!existing) { toast('Competition not found', 'error'); return; }

    // Validate required fields before submitting
    const missing = [];
    if (!existing.name     || !String(existing.name).trim())      missing.push('Competition Name');
    if (!existing.organizer|| !String(existing.organizer).trim()) missing.push('Organizer');
    if (!existing.level    || !String(existing.level).trim())     missing.push('Level');
    if (!existing.category || !String(existing.category).trim())  missing.push('Category');
    if (missing.length) {
      toast(`Cannot submit — please fill in: ${missing.join(', ')}`, 'error');
      return;
    }

    // Team leader full name is required
    const leaderName = existing.leader_name || existing.leaderName || '';
    if (!String(leaderName).trim()) {
      openModal(
        '⚠️ Team Leader Name Required',
        `<div style="text-align:center;padding:12px 0 4px">
          <div style="font-size:40px;margin-bottom:12px">📝</div>
          <p style="color:var(--text);font-size:15px;font-weight:500;margin-bottom:8px">
            Team Leader's full name is required before submitting.
          </p>
          <p style="color:var(--text2);font-size:13px">
            Please open the submission form and fill in the <strong>Full Name</strong>
            field under the <em>Team Leader</em> section.
          </p>
        </div>`,
        `<button class="btn btn-ghost" onclick="closeModalDirect()">Close</button>
         <button class="btn btn-primary" onclick="closeModalDirect();openSubmissionForm('${id}')">✏️ Open & Fix</button>`
      );
      return;
    }

    const payload = {
      name:         existing.name,
      organizer:    existing.organizer   || '',
      level:        existing.level,
      category:     existing.category   || 'Technology',
      dateStart:    toDateInput(existing.date_start || existing.dateStart),
      dateEnd:      toDateInput(existing.date_end   || existing.dateEnd),
      members:      existing.members    || [],
      leader:       existing.leader_nim || existing.leader || '',
      funding:      existing.funding    || 0,
      proposalLink: existing.proposal_link || existing.proposalLink || '',
      exemption:    !!existing.exemption,
      major:        existing.major      || user.major || 'Informatics',
      action:       'submit',
    };
    await saveCompetition(payload, id);
    toast(`${id} submitted for PIC review 🎉`, 'success');
    renderPage();
  } catch (err) {
    toast(err.message || 'Submit failed', 'error');
  }
}

async function openSubmissionForm(editId) {
  // Reset member list before opening
  membersList = [];

  // Fetch fresh user data from API to ensure major is up-to-date
  let freshMajor = user.major || '';
  try {
    const meRes = await apiFetch('/auth/me');
    const meData = await meRes.json();
    if (meData.success && meData.user) {
      freshMajor = meData.user.major || '';
      const updated = { ...getCurrentUser(), ...meData.user };
      localStorage.setItem('ct_user', JSON.stringify(updated));
      user.major = freshMajor;
    }
  } catch { /* use cached major on failure */ }

  // If editing, fetch the existing competition fresh from the API
  let e = null;
  if (editId) {
    e = await getCompetition(editId);
    if (e) {
      const leaderNim = e.leader_nim || e.leader || '';
      const detail = e.members_detail && e.members_detail.length > 0 ? e.members_detail : [];
      membersList = (e.members || []).map(m => {
        const nim = typeof m === 'object' ? (m.nim || m.user_nim || '') : m;
        const d = detail.find(d => d.nim === nim) || {};
        const rawMajor = d.major || m.major || '';
        let memberMajorOnly = rawMajor;
        let memberRegionOnly = '';
        if (rawMajor.includes(' - ')) {
          const parts = rawMajor.split(' - ');
          memberMajorOnly = parts[0].trim();
          memberRegionOnly = parts.slice(1).join(' - ').trim();
        }
        return { nim, name: d.name || m.name || '', phone: d.phone || m.phone || '', email: d.email || m.email || '', major: memberMajorOnly, region: memberRegionOnly };
      }).filter(m => m.nim && m.nim !== leaderNim);
    }
  }

  const displayMajor = e?.major || freshMajor;

  // ── Build unique sorted major list and per-major region helper ──
  const allMajors = [...new Set(Object.values(MAJORS_LIST).flat())].sort();

  function regionsForMajor(maj) {
    return Object.entries(MAJORS_LIST)
      .filter(([, majors]) => majors.includes(maj))
      .map(([campus]) => campus);
  }

  // ── Derive saved leader major and region ──
  // Stored as "Major - Region" (new) or just "Major" (legacy)
  let leaderMajorOnly = displayMajor || '';
  let leaderRegionOnly = '';
  if (e?.leader_major) {
    const lm = e.leader_major;
    if (lm.includes(' - ')) {
      const parts = lm.split(' - ');
      leaderMajorOnly = parts[0].trim();
      leaderRegionOnly = parts.slice(1).join(' - ').trim();
    } else {
      leaderMajorOnly = lm.trim();
    }
  }
  const initRegions = leaderMajorOnly ? regionsForMajor(leaderMajorOnly) : [];

  openModal(e ? 'Edit Submission' : 'New Competition Submission', `
  <style>
    .form-section {
      grid-column: 1 / -1;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 10px;
      padding: 16px 18px 8px;
      margin-bottom: 4px;
      position: relative;
    }
    .form-section-title {
      position: absolute;
      top: -11px;
      left: 14px;
      background: var(--surface, #fff);
      padding: 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--accent, #4f8aff);
      text-transform: uppercase;
    }
    .member-card {
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
      position: relative;
      background: var(--surface2, #f8fafc);
    }
    .member-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .member-card-remove {
      position: absolute; top: 8px; right: 10px;
      cursor: pointer; color: var(--text3, #94a3b8); font-size: 16px; line-height:1;
    }
    .member-card-remove:hover { color: var(--danger, #ef4444); }
    .member-card label { font-size: 11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text2,#64748b); display:block; margin-bottom:4px; }
    .member-card input, .member-card select { width:100%; padding:7px 10px; border:1px solid var(--border,#e2e8f0); border-radius:6px; font-size:13px; background:var(--surface,#fff); color:var(--text1,#1e293b); box-sizing:border-box; }
    .member-card input:focus, .member-card select:focus { outline:none; border-color:var(--accent,#4f8aff); box-shadow:0 0 0 3px rgba(79,138,255,.12); }
    .add-member-btn { margin-top:10px; width:100%; }
  </style>
  <div class="form-grid">

    <!-- ── COMPETITION INFO ─────────────────────────── -->
    <div class="form-section">
      <span class="form-section-title">Competition Info</span>
      <div class="form-grid" style="margin-top:4px">
        <div class="form-group full"><label>Competition Name *</label><input id="f-name" value="${e?.name||''}"></div>
        <div class="form-group"><label>Organizer *</label><input id="f-org" value="${e?.organizer||''}"></div>
        <div class="form-group"><label>Level *</label>
          <select id="f-level">${['regional','national','international'].map(l=>`<option value="${l}" ${e?.level===l?'selected':''}>${l[0].toUpperCase()+l.slice(1)}</option>`).join('')}</select>
        </div>
        <div class="form-group full"><label>Category</label>
          <select id="f-cat">${['Technology','Business','Research','Arts','Science','Other'].map(c=>`<option ${e?.category===c?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Start Date *</label><input type="date" id="f-start" value="${toDateInput(e?.date_start||e?.dateStart)}"></div>
        <div class="form-group"><label>End Date *</label><input type="date" id="f-end" value="${toDateInput(e?.date_end||e?.dateEnd)}"></div>
        <div class="form-group full"><label>Proposal Link</label><input id="f-link" placeholder="https://drive.google.com/..." value="${e?.proposal_link||e?.proposalLink||''}"></div>
        <div class="form-group full"><label>Exemption Request</label>
          <select id="f-disp">
            <option value="1" ${e?.exemption?'selected':''}>Yes – Request Exemption Letter</option>
            <option value="0" ${!e?.exemption?'selected':''}>No</option>
          </select>
        </div>
        <div class="form-group full"><label>Department / Major</label>
          <input id="f-major" value="${displayMajor}" readonly style="background:var(--surface2);cursor:not-allowed;opacity:.7" placeholder="Set your major in Profile first">
          ${!freshMajor ? `<div style="font-size:11px;color:var(--warn);margin-top:4px">⚠️ You have no major set on your profile. <a href="profile.html" style="color:var(--accent)">Set it now</a></div>` : ''}
        </div>
        <div class="form-group full"><label>Estimated Funding (IDR)</label><input type="text" id="f-funding" placeholder="e.g. 1.000.000" value="${e?.funding ? Number(e.funding).toLocaleString('id-ID') : ''}" oninput="formatFundingInput(this)"></div>
      </div>
    </div>

    <!-- ── TEAM LEADER ──────────────────────────────── -->
    <div class="form-section">
      <span class="form-section-title">Team Leader</span>
      <div class="form-grid" style="margin-top:4px">
        <div class="form-group"><label>Full Name *</label><input id="f-leader-name" placeholder="Full name..." value="${e?.leader_name||''}" onblur="if(!this.value.trim()){this.style.borderColor='var(--danger)';this.style.boxShadow='0 0 0 3px rgba(255,92,106,0.18)'}else{this.style.borderColor='';this.style.boxShadow=''}" oninput="if(this.value.trim()){this.style.borderColor='';this.style.boxShadow=''}"></div>
        <div class="form-group"><label>NIM *</label><input id="f-leader" value="${e?.leader_nim||e?.leader||user.nim||''}" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
        <div class="form-group"><label>Phone Number</label><input id="f-leader-phone" placeholder="e.g. 08123456789" type="tel" value="${e?.leader_phone||''}"></div>
        <div class="form-group"><label>Email</label><input id="f-leader-email" placeholder="e.g. name@email.com" type="email" value="${e?.leader_email||''}"></div>
        <div class="form-group">
          <label>Major *</label>
          <select id="f-leader-major" onchange="syncLeaderRegion()">
            <option value="">— Select Major —</option>
            ${allMajors.map(m => `<option value="${m}" ${m === leaderMajorOnly ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Region / Campus *</label>
          <select id="f-leader-region">
            <option value="">— Select Region —</option>
            ${initRegions.map(r => `<option value="${r}" ${r === leaderRegionOnly ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <!-- ── TEAM MEMBERS ─────────────────────────────── -->
    <div class="form-section">
      <span class="form-section-title">Team Members</span>
      <div id="member-cards">${renderMemberCards()}</div>
      <button class="btn btn-ghost add-member-btn" type="button" onclick="addMemberCard()">+ Add Member</button>
    </div>

    <!-- ── SUPPORTING DOCUMENTS ────────────────────── -->
    <div class="form-section">
      <span class="form-section-title">Supporting Documents</span>
      <p style="font-size:12px;color:var(--text3);margin:6px 0 14px;">
        Upload proof that this competition exists. At least one document is required before submitting.
      </p>

      <!-- Competition URL -->
      <div class="supdoc-row">
        <div class="supdoc-label-wrap">
          <span class="supdoc-icon">🔗</span>
          <div>
            <div class="supdoc-label">Official Competition Link</div>
            <div class="supdoc-hint">Website, registration page, or official announcement URL</div>
          </div>
        </div>
        <input type="url" id="f-comp-url" class="supdoc-url-input" placeholder="https://competition.example.com" />
      </div>

      <!-- Flyer / Poster -->
      <div class="supdoc-row">
        <div class="supdoc-label-wrap">
          <span class="supdoc-icon">🪧</span>
          <div>
            <div class="supdoc-label">Flyer / Poster <span class="supdoc-badge">Image</span></div>
            <div class="supdoc-hint">Official competition flyer or promotional poster</div>
          </div>
        </div>
        <div class="supdoc-upload-wrap">
          <div class="file-drop-zone supdoc-drop" id="drop-f-flyer" onclick="document.getElementById('f-flyer').click()"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleFileDrop(event,'f-flyer')">
            <input type="file" id="f-flyer" accept=".jpg,.jpeg,.png,.pdf" style="display:none"
              onchange="handleFileSelect(this,'drop-f-flyer')">
            <div class="file-drop-icon" style="font-size:18px">📎</div>
            <div class="file-drop-text" style="font-size:12px">Click or drag file here</div>
            <div class="file-drop-sub">JPG, PNG, PDF</div>
          </div>
          <div class="file-preview" id="preview-f-flyer" style="display:none"></div>
        </div>
      </div>

      <!-- Screenshot / Announcement -->
      <div class="supdoc-row">
        <div class="supdoc-label-wrap">
          <span class="supdoc-icon">📸</span>
          <div>
            <div class="supdoc-label">Screenshot / Announcement <span class="supdoc-badge">Image</span></div>
            <div class="supdoc-hint">Screenshot of official social media post, email, or announcement</div>
          </div>
        </div>
        <div class="supdoc-upload-wrap">
          <div class="file-drop-zone supdoc-drop" id="drop-f-screenshot" onclick="document.getElementById('f-screenshot').click()"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleFileDrop(event,'f-screenshot')">
            <input type="file" id="f-screenshot" accept=".jpg,.jpeg,.png,.pdf" style="display:none"
              onchange="handleFileSelect(this,'drop-f-screenshot')">
            <div class="file-drop-icon" style="font-size:18px">📎</div>
            <div class="file-drop-text" style="font-size:12px">Click or drag file here</div>
            <div class="file-drop-sub">JPG, PNG, PDF</div>
          </div>
          <div class="file-preview" id="preview-f-screenshot" style="display:none"></div>
        </div>
      </div>

      <!-- Proposal / Terms & Conditions -->
      <div class="supdoc-row">
        <div class="supdoc-label-wrap">
          <span class="supdoc-icon">📄</span>
          <div>
            <div class="supdoc-label">Proposal / Terms &amp; Conditions <span class="supdoc-badge supdoc-badge--pdf">PDF</span></div>
            <div class="supdoc-hint">Competition guidebook, TOR, or your team's proposal document</div>
          </div>
        </div>
        <div class="supdoc-upload-wrap">
          <div class="file-drop-zone supdoc-drop" id="drop-f-proposal" onclick="document.getElementById('f-proposal').click()"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleFileDrop(event,'f-proposal')">
            <input type="file" id="f-proposal" accept=".pdf,.jpg,.jpeg,.png" style="display:none"
              onchange="handleFileSelect(this,'drop-f-proposal')">
            <div class="file-drop-icon" style="font-size:18px">📎</div>
            <div class="file-drop-text" style="font-size:12px">Click or drag file here</div>
            <div class="file-drop-sub">PDF, JPG, PNG</div>
          </div>
          <div class="file-preview" id="preview-f-proposal" style="display:none"></div>
        </div>
      </div>

      <!-- Other / Additional -->
      <div class="supdoc-row" style="border-bottom:none">
        <div class="supdoc-label-wrap">
          <span class="supdoc-icon">📁</span>
          <div>
            <div class="supdoc-label">Other Supporting Files</div>
            <div class="supdoc-hint">Any additional documents relevant to this submission</div>
          </div>
        </div>
        <div class="supdoc-upload-wrap">
          <div class="file-drop-zone supdoc-drop" id="drop-f-docs" onclick="document.getElementById('f-docs').click()"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleFileDrop(event,'f-docs')">
            <input type="file" id="f-docs" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none"
              onchange="handleFileSelect(this,'drop-f-docs')">
            <div class="file-drop-icon" style="font-size:18px">📎</div>
            <div class="file-drop-text" style="font-size:12px">Click or drag files here</div>
            <div class="file-drop-sub">PDF, JPG, PNG · Multiple allowed</div>
          </div>
          <div class="file-preview" id="preview-f-docs" style="display:none"></div>
        </div>
      </div>

    </div>

  </div>`,
  `<button class="btn btn-ghost" onclick="closeModalDirect()">Cancel</button>
   <button class="btn btn-ghost" onclick="saveSubmission('draft','${editId||''}')">Save as Draft</button>
   <button class="btn btn-primary" onclick="saveSubmission('submit','${editId||''}')">Submit</button>`);
}

// ── Sync region dropdown when major changes ───────────────
// Repopulates Region with only the campuses that offer the
// selected major, then resets the selection to blank.
function syncLeaderRegion() {
  const maj = document.getElementById('f-leader-major')?.value || '';
  const regionSel = document.getElementById('f-leader-region');
  if (!regionSel) return;
  const regions = maj
    ? Object.entries(MAJORS_LIST)
        .filter(([, majors]) => majors.includes(maj))
        .map(([campus]) => campus)
    : [];
  regionSel.innerHTML = '<option value="">— Select Region —</option>'
    + regions.map(r => `<option value="${r}">${r}</option>`).join('');
}

// Repopulates a member's Region dropdown when their Major changes.
function syncMemberRegion(i, maj) {
  updateMember(i, 'major', maj);
  updateMember(i, 'region', '');
  const regionSel = document.getElementById(`mc-region-${i}`);
  if (!regionSel) return;
  const regions = maj
    ? Object.entries(MAJORS_LIST)
        .filter(([, majors]) => majors.includes(maj))
        .map(([campus]) => campus)
    : [];
  regionSel.innerHTML = '<option value="">— Select Region —</option>'
    + regions.map(r => `<option value="${r}">${r}</option>`).join('');
}

function renderMemberCards() {
  if (membersList.length === 0) return '<p style="color:var(--text3);font-size:13px;margin:10px 0 4px">No members added yet.</p>';
  return membersList.map((m, i) => {
    const regionsForMaj = m.major
      ? Object.entries(MAJORS_LIST)
          .filter(([, majors]) => majors.includes(m.major))
          .map(([campus]) => campus)
      : [];
    return `
    <div class="member-card" id="mc-${i}">
      <span class="member-card-remove" onclick="removeMemberCard(${i})">×</span>
      <div class="member-card-grid">
        <div><label>Full Name</label><input placeholder="Full name..." value="${m.name||''}" oninput="updateMember(${i},'name',this.value)"></div>
        <div><label>NIM</label><input placeholder="NIM..." value="${m.nim||''}" type="text" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'');updateMember(${i},'nim',this.value)"></div>
        <div><label>Phone Number</label><input placeholder="e.g. 08123456789" type="tel" value="${m.phone||''}" oninput="updateMember(${i},'phone',this.value)"></div>
        <div><label>Email</label><input placeholder="e.g. name@email.com" type="email" value="${m.email||''}" oninput="updateMember(${i},'email',this.value)"></div>
        <div>
          <label>Major</label>
          <select id="mc-major-${i}" onchange="syncMemberRegion(${i},this.value)">
            <option value="">— Select Major —</option>
            ${[...new Set(Object.values(MAJORS_LIST).flat())].sort().map(mj =>
              `<option value="${mj}" ${m.major===mj?'selected':''}>${mj}</option>`
            ).join('')}
          </select>
        </div>
        <div>
          <label>Region / Campus</label>
          <select id="mc-region-${i}" onchange="updateMember(${i},'region',this.value)">
            <option value="">— Select Region —</option>
            ${regionsForMaj.map(r => `<option value="${r}" ${m.region===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addMemberCard() {
  membersList.push({ nim: '', name: '', phone: '', email: '', major: '', region: '' });
  document.getElementById('member-cards').innerHTML = renderMemberCards();
}

function removeMemberCard(i) {
  membersList.splice(i, 1);
  document.getElementById('member-cards').innerHTML = renderMemberCards();
}

function updateMember(i, field, val) {
  if (membersList[i]) membersList[i][field] = val;
}

async function saveSubmission(action, existingId) {
  const name = document.getElementById('f-name')?.value?.trim();
  if (!name) { toast('Competition name is required', 'error'); return; }

  // For submit (not draft), validate all required fields up-front
  if (action === 'submit') {
    const organizer   = document.getElementById('f-org')?.value?.trim();
    const level       = document.getElementById('f-level')?.value?.trim();
    const category    = document.getElementById('f-cat')?.value?.trim();
    const leaderName  = document.getElementById('f-leader-name')?.value?.trim();
    const missing = [];
    if (!organizer)  missing.push('Organizer');
    if (!level)      missing.push('Level');
    if (!category)   missing.push('Category');
    if (missing.length) {
      toast('Please fill in required fields: ' + missing.join(', '), 'error');
      return;
    }

    // Team leader full name is required to submit
    if (!leaderName) {
      openModal(
        '⚠️ Team Leader Name Required',
        `<div style="text-align:center;padding:12px 0 4px">
          <div style="font-size:40px;margin-bottom:12px">📝</div>
          <p style="color:var(--text);font-size:15px;font-weight:500;margin-bottom:8px">
            Team Leader's full name is required before submitting.
          </p>
          <p style="color:var(--text2);font-size:13px">
            Please go back and fill in the <strong>Full Name</strong> field under the
            <em>Team Leader</em> section, or save your progress as a draft first.
          </p>
        </div>`,
        `<button class="btn btn-ghost" onclick="closeModalDirect()">Go Back & Fix</button>
         <button class="btn btn-primary" onclick="closeModalDirect();saveSubmission('draft','${existingId||''}')">💾 Save as Draft</button>`
      );
      return;
    }
  }

  // Gather all document files
  const otherFiles     = document.getElementById('f-docs')?.files || [];
  const flyerFile      = document.getElementById('f-flyer')?.files?.[0];
  const screenshotFile = document.getElementById('f-screenshot')?.files?.[0];
  const proposalFile   = document.getElementById('f-proposal')?.files?.[0];
  const compUrl        = document.getElementById('f-comp-url')?.value?.trim() || '';

  // Validation: require at least one proof for 'submit' action
  if (action === 'submit' && !compUrl && !flyerFile && !screenshotFile && !proposalFile && !otherFiles.length) {
    toast('Please provide at least one supporting document or competition link before submitting.', 'error');
    return;
  }

  // Merge named docs into files array with type labels encoded in filename prefix
  const allFiles = [...otherFiles];
  if (flyerFile)      allFiles.unshift(new File([flyerFile],      `[flyer]${flyerFile.name}`,           { type: flyerFile.type }));
  if (screenshotFile) allFiles.unshift(new File([screenshotFile], `[screenshot]${screenshotFile.name}`, { type: screenshotFile.type }));
  if (proposalFile)   allFiles.unshift(new File([proposalFile],   `[proposal]${proposalFile.name}`,     { type: proposalFile.type }));

  const payload = {
    name,
    organizer:    document.getElementById('f-org').value,
    level:        document.getElementById('f-level').value,
    category:     document.getElementById('f-cat').value,
    dateStart:    document.getElementById('f-start').value,
    dateEnd:      document.getElementById('f-end').value,
    members:      membersList.map(m => m.nim).filter(Boolean),
    membersDetail: membersList.map(m => ({
      ...m,
      major: m.major && m.region ? `${m.major} - ${m.region}` : m.major,
    })),
    leader:       document.getElementById('f-leader').value,
    leaderName:   document.getElementById('f-leader-name')?.value?.trim() || '',
    leaderPhone:  document.getElementById('f-leader-phone')?.value?.trim() || '',
    leaderEmail:  document.getElementById('f-leader-email')?.value?.trim() || '',
    // Combine major + region into "Major - Region" for storage
    leaderMajor: (() => {
      const maj = document.getElementById('f-leader-major')?.value?.trim() || '';
      const reg = document.getElementById('f-leader-region')?.value?.trim() || '';
      return maj && reg ? `${maj} - ${reg}` : maj;
    })(),
    funding:      Number(String(document.getElementById('f-funding').value).replace(/[.,]/g, '')) || 0,
    proposalLink: compUrl || document.getElementById('f-link').value,
    exemption:    document.getElementById('f-disp').value === '1',
    // Use the leader's explicitly selected major as the submission's major.
    // Fall back to the read-only profile field only if nothing was selected.
    major: (() => {
      const leaderMaj = document.getElementById('f-leader-major')?.value?.trim() || '';
      return leaderMaj || document.getElementById('f-major').value;
    })(),
    action,
  };
  try {
    await saveCompetition(payload, existingId || null, allFiles);
    closeModalDirect();
    toast(action === 'submit' ? 'Submission submitted! 🎉' : 'Draft saved', 'success');
    startPolling(); // FR-04: restart poll after modal closes
    renderPage();
  } catch (err) {
    toast(err.message || 'Save failed', 'error');
  }
}

// BR-03: pass the full competition object so we can show deadline in the form header
function openAchievementForm(id, comp) {
  let deadlineNotice = '';
  if (comp && comp.achievement_deadline) {
    const days = daysUntil(comp.achievement_deadline);
    if (days !== null && days < 0) {
      deadlineNotice = `<div style="background:rgba(255,92,106,.12);border:1px solid var(--danger);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--danger);font-size:13px">
        ⛔ <strong>Deadline passed</strong> — was ${comp.achievement_deadline}. Submission may be rejected by the server.
      </div>`;
    } else if (days !== null && days <= 3) {
      deadlineNotice = `<div style="background:rgba(255,181,71,.12);border:1px solid var(--warn);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--warn);font-size:13px">
        ⚠️ <strong>Deadline in ${days} day${days===1?'':'s'}</strong> — report by ${comp.achievement_deadline}
      </div>`;
    } else if (days !== null) {
      deadlineNotice = `<div style="background:rgba(79,138,255,.08);border:1px solid rgba(79,138,255,.3);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--text2);font-size:13px">
        📅 Report deadline: <strong>${comp.achievement_deadline}</strong> (${days} days remaining)
      </div>`;
    }
  }

  openModal('Report Achievement', `
  ${deadlineNotice}
  <div class="form-grid">
    <div class="form-group full"><label>Final Result *</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${['Winner','Runner-up','Finalist','Participant'].map(r => `
        <button type="button" onclick="
          document.querySelectorAll('.result-btn').forEach(b=>b.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('ach-result').value=this.dataset.value;
        " data-value="${r}" class="result-btn btn btn-ghost btn-sm" style="flex:1;min-width:100px">${r === 'Winner' ? '🥇' : r === 'Runner-up' ? '🥈' : r === 'Finalist' ? '🎖️' : '🏅'} ${r}</button>`).join('')}
      </div>
      <input type="hidden" id="ach-result" value="Winner">
    </div>
    ${buildFileUploadField('ach-cert', 'Certificate Upload')}
    ${buildFileUploadField('ach-docs', 'Documentation Upload')}
    <div class="form-group full"><label>Notes</label><textarea id="ach-notes" placeholder="Additional information..."></textarea></div>
  </div>`,
  `<button class="btn btn-ghost" onclick="closeModalDirect()">Cancel</button>
   <button class="btn btn-success" onclick="submitAchievement('${id}')">Submit Report</button>`);
}

async function submitAchievement(id) {
  const btn = document.querySelector('.btn-success');
  if (btn) { btn.textContent = 'Submitting...'; btn.disabled = true; }
  try {
    const result = document.getElementById('ach-result')?.value || 'Participant';
    const certInput = document.getElementById('ach-cert');
    const docsInput = document.getElementById('ach-docs');
    const notes = document.getElementById('ach-notes')?.value?.trim() || '';

    const formData = new FormData();
    formData.append('result', result);
    if (notes) formData.append('notes', notes);
    if (certInput?.files?.length) formData.append('certificate', certInput.files[0]);
    if (docsInput?.files?.length) formData.append('documentation', docsInput.files[0]);

    const res = await apiFetch(`/competitions/${id}/achievement`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    closeModalDirect();
    toast('Achievement reported! Status: Completed 🎉', 'success');
    startPolling(); // FR-04
    renderPage();
  } catch (err) {
    toast(err.message || 'Failed to report', 'error');
    if (btn) { btn.textContent = 'Submit Report'; btn.disabled = false; }
  }
}

function formatFundingInput(el) {
  const pos = el.selectionStart;
  const prevLen = el.value.length;
  const raw = el.value.replace(/\./g, '').replace(/[^0-9]/g, '');
  el.value = raw ? Number(raw).toLocaleString('id-ID') : '';
  const newPos = Math.max(0, pos + (el.value.length - prevLen));
  el.setSelectionRange(newPos, newPos);
}
