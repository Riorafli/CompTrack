<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTrack — Analytics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-wrap"></div>
  <main class="main">
    <div class="topbar"><h1 class="page-title">Analytics & KPIs</h1></div>
    <div class="content" id="page-content"></div>
  </main>
</div>
<script src="app.js"></script>
<script>
const user = requireAuth(['faculty','superadmin']);
if (user) {
  initSidebar('analytics.html', user);
  (async () => {
  const stats = await getAnalytics();
  const { totals, byMajor: byMajorArr, byLevel, byStatus, monthly } = stats;
  const byMajor = {};
  byMajorArr.forEach(r => { byMajor[r.major] = r.count; });
  const totalFunding = Number(totals.total_funding || 0);
  const winners = totals.winners || 0;
  const completed = totals.completed || 0;
  const competitions = { length: totals.total };
  const barData = monthly.map(m => m.count);
  const months = monthly.map(m => m.month?.slice(5) || '');
  const maxBar = Math.max(...barData, 1);

  document.getElementById('page-content').innerHTML = `
  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-label">Total Competitions</div><div class="stat-value">${totals.total}</div><div class="stat-sub">All time</div></div>
    <div class="stat-card green"><div class="stat-label">Winners 🥇</div><div class="stat-value">${winners}</div><div class="stat-sub">First place awards</div></div>
    <div class="stat-card warn"><div class="stat-label">Total Funding</div><div class="stat-value">${formatFunding(totalFunding)}</div><div class="stat-sub">IDR requested</div></div>
    <div class="stat-card teal"><div class="stat-label">Completion Rate</div><div class="stat-value">${Math.round(totals.total > 0 ? completed/totals.total*100 : 0)}%</div><div class="stat-sub">Reported achievements</div></div>
  </div>

  <div class="card">
    <div class="card-title">📈 Monthly Submission Trend</div>
    <div class="bar-chart" style="height:120px;margin-top:8px">
      ${barData.map((v,i) => `
        <div class="bar-wrap">
          <div style="font-size:10px;color:var(--text3);margin-bottom:4px">${v}</div>
          <div class="bar" style="height:${(v/maxBar)*100}%" title="${v} submissions"></div>
          <div class="bar-label">${months[i]}</div>
        </div>`).join('')}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="card">
      <div class="card-title">Submissions by Major</div>
      ${Object.entries(byMajor).map(([m,v]) => `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
          <span>${m}</span><span style="color:var(--accent)">${v} submissions</span>
        </div>
        <div style="height:6px;background:var(--surface3);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${v/totals.total*100}%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px"></div>
        </div>
      </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">Funding by Level</div>
      ${['national','international','regional'].map(lv => {
        const lvData = byLevel.find(b=>b.level===lv)||{}; const s = Number(lvData.funding||0);
        const colors = {national:'var(--accent)',international:'var(--accent2)',regional:'var(--accent3)'};
        const count = lvData.count||0;
        return `
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
            <span style="color:${colors[lv]};text-transform:capitalize">${lv}</span>
            <span>IDR ${formatFunding(s)} · ${count} comps</span>
          </div>
          <div style="height:6px;background:var(--surface3);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${totalFunding?s/totalFunding*100:0}%;background:${colors[lv]};border-radius:3px"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card">
    <div class="card-title">Status Overview</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
      ${['draft','submitted','pic_approved','faculty_approved','completed','pic_rejected'].map(s => {
        const count = (byStatus.find(b=>b.status===s)||{}).count||0;
        return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px">${count}</div>
          <div><span class="status status-${s}">${statusLabel(s)}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
  })();
}
</script>
</body>
</html>
