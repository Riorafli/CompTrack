<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTrack — Faculty Review</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-wrap"></div>
  <main class="main">
    <div class="topbar">
      <h1 class="page-title">Faculty Review</h1>
      <div class="topbar-actions">
        <div class="search-bar"><input id="search-input" placeholder="Search..." oninput="renderPage()"></div>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </main>
</div>
<div id="modal-placeholder"></div>
<script src="app.js"></script>
<script>
const user = requireAuth(['faculty','superadmin']);
if (user) {
  document.getElementById('modal-placeholder').innerHTML = MODAL_HTML;
  initSidebar('faculty-review.html', user);
  renderPage();
}

// BR-03: days remaining from today to a YYYY-MM-DD deadline string
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

// Normalise any date value to plain YYYY-MM-DD for display
function toDateStr(val) {
  if (!val) return '—';
  if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  const d = val instanceof Date ? val : new Date(val);
  if (isNaN(d.getTime())) return '—';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// BR-03: show deadline info on already-approved rows (faculty_approved / letter_generated)
function deadlineBadge(comp) {
  if (!comp.achievement_deadline) return '<span style="color:var(--text3)">—</span>';
  if (comp.achievement) return '<span style="color:var(--success);font-size:12px">✅ Reported</span>';
  const days  = daysUntil(comp.achievement_deadline);
  const label = comp.achievement_deadline;
  if (days === null) return '<span style="color:var(--text3)">—</span>';
  if (days < 0)  return `<span style="color:var(--danger);font-size:12px;font-weight:600">⛔ Overdue<br><span style="font-weight:400">${label}</span></span>`;
  if (days <= 3) return `<span style="color:var(--warn);font-size:12px;font-weight:600">⚠️ ${days}d left<br><span style="font-weight:400">${label}</span></span>`;
  return `<span style="color:var(--text2);font-size:12px">📅 ${days}d left<br><span style="color:var(--text3)">${label}</span></span>`;
}

async function renderPage() {
  const q = document.getElementById('search-input')?.value?.toLowerCase()||'';
  // Show both pending-review and already-approved (so faculty can track deadlines)
  const [pending, approved] = await Promise.all([
    getCompetitions({ status: 'pic_approved' }),
    getCompetitions({ status: 'faculty_approved' }),
  ]);
  let pendingFiltered  = pending;
  let approvedFiltered = approved;
  if (q) {
    pendingFiltered  = pending.filter(c  => c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q));
    approvedFiltered = approved.filter(c => c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q));
  }

  // BR-03: flag any overdue approved competitions
  const overdue = approvedFiltered.filter(c => c.achievement_deadline && daysUntil(c.achievement_deadline) < 0 && !c.achievement);

  document.getElementById('page-content').innerHTML = `

  ${overdue.length ? `
  <div class="card" style="border-color:rgba(255,92,106,.4);margin-bottom:0">
    <div class="card-title" style="color:var(--danger)">⛔ Overdue Achievement Reports (${overdue.length})</div>
    ${overdue.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:500">${c.name}</div>
        <div style="font-size:12px;color:var(--text3)">${c.id} · deadline was ${c.achievement_deadline}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="viewDetail('${c.id}',${JSON.stringify(user).replace(/"/g,'&quot;')})">View</button>
    </div>`).join('')}
  </div>` : ''}

  ${pendingFiltered.length ? `
  <div class="card">
    <div class="card-title">PIC-Approved — Awaiting Faculty Review <span style="color:var(--accent);font-size:14px;font-family:var(--font-sans)">(${pendingFiltered.length})</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Competition</th><th>Major</th><th>Funding</th><th>Exemption</th><th>Actions</th></tr></thead>
        <tbody>
          ${pendingFiltered.map(c => `
          <tr>
            <td style="font-size:11px;color:var(--text3)">${c.id}</td>
            <td><div class="td-main">${c.name}</div><div style="font-size:11px;color:var(--text3)">${c.organizer} · <span class="level-badge level-${c.level}">${c.level}</span></div></td>
            <td>${c.major}</td>
            <td>IDR ${c.funding.toLocaleString()}</td>
            <td>${c.exemption?'<span style="color:var(--warn)">Yes — Letter Needed</span>':'No'}</td>
            <td style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" onclick="viewDetail('${c.id}',${JSON.stringify(user).replace(/"/g,'&quot;')})">View</button>
              <button class="btn btn-success btn-sm" onclick="doApprove('${c.id}','faculty')">Approve${c.exemption?' + Letter':''}</button>
              <button class="btn btn-danger btn-sm" onclick="openRejectModal('${c.id}','faculty')">Reject</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>` : `
  <div class="card">
    <div class="empty-state">
      <div class="empty-icon">✅</div>
      <div class="empty-title">No submissions for review</div>
      <div class="empty-sub">All PIC-approved submissions have been processed</div>
    </div>
  </div>`}

  ${approvedFiltered.length ? `
  <div class="card">
    <div class="card-title">Faculty-Approved — Achievement Deadline Tracker</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Competition</th><th>Major</th><th>End Date</th><th>Report Deadline</th><th>Actions</th></tr></thead>
        <tbody>
          ${approvedFiltered.map(c => `
          <tr>
            <td style="font-size:11px;color:var(--text3)">${c.id}</td>
            <td><div class="td-main">${c.name}</div><div style="font-size:11px;color:var(--text3)">${c.organizer}</div></td>
            <td>${c.major}</td>
            <td style="font-size:12px;color:var(--text3)">${toDateStr(c.date_end)}</td>
            <td>${deadlineBadge(c)}</td>
            <td>
              <button class="btn btn-ghost btn-sm" onclick="viewDetail('${c.id}',${JSON.stringify(user).replace(/"/g,'&quot;')})">View</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>` : ''}`;
}
</script>
</body>
</html>
